name: lab4-ci
 
on:
  push:
    branches: [main]
  pull_request:
 
permissions:
  contents: read
 
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one red cell must not cancel the others
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            lab4/requirements.txt
            lab4/requirements-dev.txt
      - run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
      - working-directory: lab4
        run: python -m pytest
 
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke test container
        run: |
          docker run -d --name app -p 8000:8000 acs730-lab4:smoke
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  image:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
 
  report:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: echo "built ${{ needs.image.outputs.image-ref }}" 

  summary:
    needs: [test, smoke, image, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "test ${{ needs.test.result }} smoke ${{ needs.smoke.result }} image ${{ needs.image.result }} report ${{ needs.report.result }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

