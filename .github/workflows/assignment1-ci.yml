name: Assignment 1 - CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assignment1/**'
      - '.github/workflows/assignment1-*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - staging
          - prod

    defaults:
      run:
        working-directory: assignment1/terraform/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform format check
        run: terraform fmt -check -recursive ../

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  validate-ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignment1/ansible

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install \
            "ansible-core>=2.19,<2.20" \
            boto3 botocore

          ansible-galaxy collection install \
            -r requirements.yml

      - name: Validate playbook syntax
        run: |
          ansible-playbook \
            -i localhost, \
            site.yml \
            --syntax-check
